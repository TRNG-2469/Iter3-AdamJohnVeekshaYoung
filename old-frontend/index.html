<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <script src="./js/login.js" defer></script>
        <link rel="stylesheet" href="./css/loginstyle.css">

        <title>ERS Login</title>
    </head>
    <body>
        <div class="contentContainer">

            <h1 id="titleE">Employee Reimbursement System</h1>

            <h2>Login</h2>

            <form id="loginForm">
                <div class="entry">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required placeholder="John Doe">
                </div>

                <div class="entry">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <p id="error"></p>

                <div class="entry">
                    <button type="submit" id="loginButton">Login</button>
                </div>

                <p id="caption">No account?
                    <a href="./register.html" id="registerLink">Sign up</a>
                </p>

            </form>


        </div>

    </body>
</html>
