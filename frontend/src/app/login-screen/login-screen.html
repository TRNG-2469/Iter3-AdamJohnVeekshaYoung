<div class="contentContainer">

    <h1 id="titleE">Employee Reimbursement System</h1>

    <h2>Login</h2>

    <form id="loginForm" (ngSubmit="onSubmit()")>
        <div class="entry">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required placeholder="John Doe" [(ngModel)]="username">
        </div>

        <div class="entry">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required [(ngModel)]="password">
        </div>

        <p id="error">{{errorMessage}}</p>

        <div class="entry">
            <button type="submit" id="loginButton" routerLink="/reimbursements">Login</button>
        </div>

        <p id="caption">No account?
            <a id="registerLink" routerLink="/register">Sign up</a>
        </p>
    </form>

</div>
