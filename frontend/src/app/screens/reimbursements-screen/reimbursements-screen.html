@if (currentUser) {
<p>
  Logged in as:
  <strong id="username">{{currentUser.firstName}}</strong>
  (<span id="role">{{currentUser.role}}</span>)
</p>
}

<hr>

<h2>Reimbursement Manager</h2>

<form id="filterForm" (submit)="$event.preventDefault(); applyFilter()">
    <label for="status">Status:</label>

    <select id="status" [(ngModel)]="selected_Status" name="status">
        <option value="">All</option>
        <option value="PENDING">Pending</option>
        <option value="APPROVED">Approved</option>
        <option value="DENIED">Denied</option>
    </select>

    <span id="departmentFilter" hidden>
        <label for="department">Department:</label>

        <select id="department">
            <option value="">All</option>
        </select>
    </span>

    <button type="submit">Filter</button>
</form>


<div>
    <button id="createReimbursementButton">Create Reimbursement</button>

    <form id="createReimbursementForm" hidden>
        <div class="entry">
            <label for="amount">Amount ($):</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" max="999999" required>
        </div>

        <div class="entry">
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="TRAVEL">Travel</option>
                <option value="FOOD">Food</option>
                <option value="LODGING">Lodging</option>
                <option value="MEDICAL">Medical</option>
                <option value="TRANSPORTATION">Transportation</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div class="entry">
            <label for="description">Description:</label>
            <textarea id="description" name="description" maxlength="255"></textarea>
        </div>

        <div class="entry" id="form-buttons">
            <button type="button" id="cancelCreateReimbursement">Cancel</button>
            <button type="submit">Submit</button>
        </div>
    </form>

    <button id="historyButton" hidden>Reimbursement History</button>

    <button id="ownReimbursementsButton" hidden>
        See Own Reimbursements
    </button>
</div>

<!-- Only loads the reimbursement list once it is nonnull-->
@if (currentUser) {
    <app-reimbursement-list
      [currentUser] = "currentUser"
      [filtered_status] = "filtered_status">

    </app-reimbursement-list>
}

<p id="error"></p>

<button id="logout" routerLink="/">Logout</button>
